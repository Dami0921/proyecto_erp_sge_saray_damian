name: Tests

# Integración continua: en cada push a main y en cada Pull Request se revisa el estilo,
# se compila el frontend y se corren todas las pruebas contra un MySQL real.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, dom, ctype, iconv, intl, pdo_mysql, gd, zip, fileinfo, simplexml, xmlreader, xmlwriter
          coverage: none

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Estilo de código (Pint)
        run: ./vendor/bin/pint --test

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Las vistas usan @vite: sin compilar, las pruebas que renderizan páginas fallan
      - name: Compilar el frontend
        run: |
          npm ci
          npm run build

      - name: Pruebas
        run: php artisan test
